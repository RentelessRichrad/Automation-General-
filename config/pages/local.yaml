# 本地示例站点的页面与元素（页面名用 l_ 前缀，避免和 demo 站点重名）
pages:

  l_login:
    path: /login.html
    wait_for: {id: username}
    elements:
      username:  {id: username}
      password:  {id: password}
      login_btn: {css: "button[type=submit]"}
      flash:     {id: flash}

  l_secure:
    path: /secure.html
    wait_for: {text: Logout}
    elements:
      logout:  {text: Logout}
      flash:   {id: flash}

  l_tables:
    path: /tables.html
    elements:
      table1: {id: table1}

  l_dropdown:
    path: /dropdown.html
    wait_for: {id: dropdown}
    elements:
      # select_any 演示：不指定具体值，框架自己挑一个有效选项
      dropdown: {id: dropdown}
      # 偏好值优先：下面这个下拉里有「启用」，应被优先选中
      type:     {id: multi}
      # 当前被选中的那一项，用来断言"确实选中了、且不是占位项"
      chosen:   {css: "#dropdown option:checked"}
